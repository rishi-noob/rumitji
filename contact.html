<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Rumit Walia</title>
  <meta name="description" content="Get in touch with Rumit Walia for collaborations, speaking engagements, or inquiries.">
  <link rel="icon" href="assets/images/logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/typography.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body data-page="contact">
  <div id="site-header"></div>
  <main>
    <section class="page-hero">
      <div class="container">
        <h1 class="page-hero__title">Contact</h1>
        <p class="page-hero__subtitle">Interested in working together? Whether you're looking for a speaker, a collaborator, or want to discuss ideas, I'd love to hear from you.</p>
      </div>
    </section>
    <section class="section">
      <div class="container section">
        <div class="split contact-split">
          <div>
            <h2 style="font-family: var(--font-display); font-size: var(--fs-h1); margin-bottom: var(--spacing-xl); color: var(--color-navy);">Get in Touch</h2>
            <div class="contact-info">
              <div class="contact-info__item">
                <div class="contact-info__icon">📧</div>
                <div>
                  <div class="contact-info__label">Email</div>
                  <div class="contact-info__value"><a href="mailto:connect@rumitwalia.in">connect@rumitwalia.in</a></div>
                </div>
              </div>
              <div class="contact-info__item">
                <div class="contact-info__icon">📞</div>
                <div>
                  <div class="contact-info__label">Phone</div>
                  <div class="contact-info__value"><a href="tel:+919654940577">+91-965-494-0577</a></div>
                </div>
              </div>
              <div class="contact-info__item">
                <div class="contact-info__icon">📍</div>
                <div>
                  <div class="contact-info__label">Location</div>
                  <div class="contact-info__value">New Delhi, India</div>
                </div>
              </div>
              <div class="contact-info__item">
                <div class="contact-info__icon">🌐</div>
                <div>
                  <div class="contact-info__label">Website</div>
                  <div class="contact-info__value"><a href="https://www.rumitwalia.in" target="_blank" rel="noopener">rumitwalia.in</a></div>
                </div>
              </div>
            </div>
            <div class="contact-map" style="margin-top: var(--spacing-2xl);">
              <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d224345.83923192776!2d77.06889754725782!3d28.52758200617607!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x390cfd5b347eb62d%3A0x52c2b7494e204dce!2sNew%20Delhi%2C%20Delhi!5e0!3m2!1sen!2sin!4v1678901234567" allowfullscreen loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
          </div>
          <div class="contact-form-wrapper">
            <h3 style="font-family: var(--font-display); font-size: var(--fs-h2); margin-bottom: var(--spacing-lg); color: var(--color-navy);">Send a Message</h3>
            <form class="contact-form" id="contact-form" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
              <div class="form-row">
                <div class="form-group">
                  <label for="firstName" class="form-label required">First Name</label>
                  <input type="text" id="firstName" name="firstName" class="form-input" placeholder="Your first name" required>
                </div>
                <div class="form-group">
                  <label for="lastName" class="form-label required">Last Name</label>
                  <input type="text" id="lastName" name="lastName" class="form-input" placeholder="Your last name" required>
                </div>
              </div>
              <div class="form-group">
                <label for="email" class="form-label required">Email</label>
                <input type="email" id="email" name="email" class="form-input" placeholder="your@email.com" required>
              </div>
              <div class="form-group">
                <label for="subject" class="form-label">Subject</label>
                <input type="text" id="subject" name="subject" class="form-input" placeholder="Subject of your message">
              </div>
              <div class="form-group">
                <label for="message" class="form-label required">Message</label>
                <textarea id="message" name="message" class="form-textarea" placeholder="Write your message..." rows="6" required></textarea>
              </div>
              <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">Send Message</button>
            </form>
          </div>
        </div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="js/components.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/form.js"></script>
  <script src="js/animations.js"></script>
</body>
</html>
